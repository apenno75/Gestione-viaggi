  <!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Camper</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FullCalendar CDN -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --bg: #f4f7f6;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: var(--bg); 
            display: flex; 
        }
        
        /* Sidebar Menu (Desktop) */
        nav { 
            width: 250px; 
            background: var(--primary); 
            color: white; 
            height: 100vh; 
            padding-top: 20px; 
            position: fixed; 
            top: 0;
            left: 0;
            z-index: 100;
        }
        
        nav h2 { 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 1.4rem;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
        }
        
        nav button { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: none; 
            border: none; 
            color: white; 
            text-align: left; 
            font-size: 16px; 
            cursor: pointer; 
            border-bottom: 1px solid #34495e; 
        }
        
        nav button:hover, nav button.active { 
            background: #34495e; 
            border-left: 4px solid var(--secondary); 
        }
        
        /* Main Content (Desktop) */
        main { 
            margin-left: 250px; 
            padding: 30px; 
            width: calc(100% - 250px); 
            max-width: 100%;
            overflow-x: hidden;
        }
        
        .panel { 
            display: none; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            max-width: 100%;
            overflow-x: hidden;
        }
        
        .panel.active { 
            display: block; 
        }
        
        h3 { 
            color: var(--primary); 
            border-bottom: 2px solid var(--secondary); 
            padding-bottom: 10px; 
            margin-top: 0;
        }
        
        /* Forms & Inputs */
        .form-group { 
            margin-bottom: 15px; 
        }
        
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #333; 
        }
        
        input[type="text"], input[type="number"], input[type="date"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 16px;
        }
        
        .btn-submit { 
            background: var(--secondary); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
        }
        
        .btn-submit:hover { 
            background: #219653; 
        }
        
        /* Contenitore Tabella Reattivo */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 15px;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 500px;
        }
        
        th, td { 
            padding: 10px 12px; 
            text-align: left; 
            border-bottom: 1px solid #ddd; 
        }
        
        th { 
            background-color: var(--primary); 
            color: white; 
        }
        
        .total-row { 
            background-color: #e9ecef; 
            font-weight: bold; 
        }

        .grid-2 { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
        }

        /* Contenitore Calendario */
        #calendar-container {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        /* --- STILI PER SMARTPHONE E TABLET (Schermi <= 768px) --- */
        @media (max-width: 768px) {
            body { 
                flex-direction: column; 
            }

            nav { 
                width: 100%; 
                height: auto; 
                position: sticky; 
                top: 0; 
                padding-top: 10px; 
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }

            nav h2 { 
                margin-bottom: 10px; 
                font-size: 1.2rem;
            }

            .nav-menu {
                flex-direction: row;
                overflow-x: auto;
                white-space: nowrap;
                -webkit-overflow-scrolling: touch;
            }

            nav button { 
                display: inline-block; 
                width: auto; 
                padding: 12px 16px; 
                border-bottom: 3px solid transparent; 
                border-right: none;
                font-size: 14px;
                flex-shrink: 0;
            }

            nav button:hover, nav button.active { 
                background: #34495e; 
                border-left: none; 
                border-bottom: 3px solid var(--secondary); 
            }

            main { 
                margin-left: 0; 
                width: 100%; 
                padding: 12px; 
            }

            .grid-2 { 
                grid-template-columns: 1fr; 
                gap: 10px; 
            }

            .panel {
                padding: 12px;
            }

            /* Optimization specifica per FullCalendar su mobile */
            .fc {
                font-size: 12px !important;
            }

            .fc .fc-toolbar {
                flex-direction: column !important;
                gap: 8px !important;
                align-items: center !important;
            }

            .fc .fc-toolbar-title {
                font-size: 1.1rem !important;
            }

            .fc .fc-button {
                padding: 5px 10px !important;
                font-size: 13px !important;
            }

            .fc .fc-daygrid-day-number {
                font-size: 11px !important;
                padding: 2px !important;
            }

            .fc .fc-daygrid-day-frame {
                min-height: 40px !important;
            }

            .fc .fc-event-title {
                font-size: 10px !important;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        }
    </style>
</head>
<body>

    <nav>
        <h2>🏕️ CamperApp</h2>
        <div class="nav-menu">
            <button onclick="switchMenu('dashboard')" class="active" id="btn-dashboard">Stato Camper</button>
            <button onclick="switchMenu('viaggi')" id="btn-viaggi">Carica Viaggi</button>
            <button onclick="switchMenu('calendario')" id="btn-calendario">Calendario</button>
            <button onclick="switchMenu('costi')" id="btn-costi">Costi Sostenuti</button>
        </div>
    </nav>

    <main>
        <!-- PANNELLO: STATO CAMPER -->
        <div id="dashboard" class="panel active">
            <h3>Impostazioni e Stato Attuale</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Km Attuali</label>
                    <input type="number" id="km_attuali">
                </div>
                <div class="form-group">
                    <label>Livello Carburante (%)</label>
                    <input type="number" id="livello_carburante" max="100">
                </div>
                <div class="form-group">
                    <label>Acque Chiare (%)</label>
                    <input type="number" id="acque_chiare" max="100">
                </div>
            </div>
            <button class="btn-submit" onclick="salvaStatoCamper()">Aggiorna Stato</button>
        </div>

        <!-- PANNELLO: CARICA VIAGGI -->
        <div id="viaggi" class="panel">
            <h3>Registra un nuovo Viaggio</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Luogo</label>
                    <input type="text" id="luogo" placeholder="Es. Dolomiti, Mare Toscana...">
                </div>
                <div class="form-group">
                    <label>Costo Giornaliero Campeggio (€)</label>
                    <input type="number" id="costo_giornaliero" step="0.01">
                </div>
                <div class="form-group">
                    <label>Data Dal</label>
                    <input type="date" id="data_dal">
                </div>
                <div class="form-group">
                    <label>Data Al</label>
                    <input type="date" id="data_al">
                </div>
            </div>
            <p><strong>Notti calcolate: </strong><span id="notti_calcolate">0</span></p>
            <button class="btn-submit" onclick="salvaViaggio()">Salva Viaggio</button>

            <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ccc;">

            <h3>Registra Rifornimento</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Luogo / Viaggio Associato</label>
                    <input type="text" id="rifornimento_luogo" list="lista-luoghi-suggeriti" placeholder="Seleziona o scrivi luogo...">
                    <datalist id="lista-luoghi-suggeriti"></datalist>
                </div>
                <div class="form-group">
                    <label>Data Rifornimento</label>
                    <input type="date" id="data_rifornimento">
                </div>
                <div class="form-group">
                    <label>Litri</label>
                    <input type="number" id="litri_rifornimento" step="0.01">
                </div>
                <div class="form-group">
                    <label>Costo Totale (€)</label>
                    <input type="number" id="costo_rifornimento" step="0.01">
                </div>
            </div>
            <button class="btn-submit" onclick="salvaRifornimento()" style="background-color: var(--primary);">Aggiungi Rifornimento</button>
        </div>

        <!-- PANNELLO: CALENDARIO -->
        <div id="calendario" class="panel">
            <h3>Calendario Viaggi</h3>
            <div id="calendar-container"></div>
        </div>

        <!-- PANNELLO: COSTI SOSTENUTI -->
        <div id="costi" class="panel">
            <h3>Riepilogo Spese Raggruppate per Luogo</h3>
            <button class="btn-submit" onclick="caricaCosti()" style="margin-bottom: 10px;">Aggiorna Dati</button>
            <div class="table-responsive">
                <table id="tabella-costi">
                    <thead>
                        <tr>
                            <th>Luogo / Destinazione</th>
                            <th>Costo Campeggio</th>
                            <th>Costo Carburante</th>
                            <th>Totale Speso (€)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Popolato da JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Inizializzazione Supabase
        const SUPABASE_URL = 'https://erukzvrtjnvyzjvfuirn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_FDhQ03affjzeyhCHuoKulg_Rp7PdyLM';
		
		// CORREZIONE: Usiamo "supabaseClient" per evitare conflitti con la libreria caricata dal CDN
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- CARICAMENTO AUTOMATICO ALL'AVVIO ---
        document.addEventListener('DOMContentLoaded', () => {
            caricaStatoCamper();
            aggiornaSuggerimentiLuoghi();
        });

        // --- GESTIONE MENU ---
        function switchMenu(menuId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-menu button').forEach(b => b.classList.remove('active'));
            document.getElementById(menuId).classList.add('active');
            document.getElementById('btn-' + menuId).classList.add('active');

            if(menuId === 'dashboard') caricaStatoCamper();
            if(menuId === 'viaggi') aggiornaSuggerimentiLuoghi();
            if(menuId === 'calendario') inizializzaCalendario();
            if(menuId === 'costi') caricaCosti();
        }

        // --- CALCOLO AUTOMATICO NOTTI ---
        const inputDal = document.getElementById('data_dal');
        const inputAl = document.getElementById('data_al');
        const displayNotti = document.getElementById('notti_calcolate');

        function calcolaNotti() {
            if(inputDal.value && inputAl.value) {
                const dal = new Date(inputDal.value);
                const al = new Date(inputAl.value);
                if(al >= dal) {
                    const diffTempo = Math.abs(al - dal);
                    const notti = Math.ceil(diffTempo / (1000 * 60 * 60 * 24));
                    displayNotti.innerText = notti;
                } else {
                    displayNotti.innerText = "Errore: 'Al' precedente a 'Dal'";
                }
            }
        }
        inputDal.addEventListener('change', calcolaNotti);
        inputAl.addEventListener('change', calcolaNotti);

        // --- POPOLA SUGGERIMENTI LUOGHI ---
        async function aggiornaSuggerimentiLuoghi() {
            const { data: viaggi } = await supabaseClient.from('viaggi').select('luogo');
            const datalist = document.getElementById('lista-luoghi-suggeriti');
            datalist.innerHTML = '';
            
            if (viaggi) {
                const luoghiUnici = [...new Set(viaggi.map(v => v.luogo).filter(Boolean))];
                luoghiUnici.forEach(luogo => {
                    const option = document.createElement('option');
                    option.value = luogo;
                    datalist.appendChild(option);
                });
            }
        }

        // --- FUNZIONI DATABASE ---

        async function caricaStatoCamper() {
            const { data, error } = await supabaseClient
                .from('stato_camper')
                .select('*')
                .order('id', { ascending: false })
                .limit(1);

            if (error) {
                console.error("Errore nel recupero dello stato camper:", error);
                return;
            }

            if (data && data.length > 0) {
                const ultimoStato = data[0];
                document.getElementById('km_attuali').value = ultimoStato.km_attuali ?? '';
                document.getElementById('livello_carburante').value = ultimoStato.livello_carburante ?? '';
                document.getElementById('acque_chiare').value = ultimoStato.livello_acque_chiare ?? '';
            }
        }

        async function salvaStatoCamper() {
            const km = document.getElementById('km_attuali').value;
            const carb = document.getElementById('livello_carburante').value;
            const acqua = document.getElementById('acque_chiare').value;

            const { data, error } = await supabaseClient
                .from('stato_camper')
                .insert([{ km_attuali: km, livello_carburante: carb, livello_acque_chiare: acqua }]);
            
            if (error) alert("Errore nel salvataggio stato: " + error.message);
            else alert("Stato aggiornato correttamente.");
        }

        async function salvaViaggio() {
            const luogo = document.getElementById('luogo').value;
            const dal = document.getElementById('data_dal').value;
            const al = document.getElementById('data_al').value;
            const costo = document.getElementById('costo_giornaliero').value;
            const notti = parseInt(document.getElementById('notti_calcolate').innerText);

            if(!luogo || !dal || !al || isNaN(notti)) return alert("Compila tutti i campi del viaggio correttamente");

            const { data, error } = await supabaseClient
                .from('viaggi')
                .insert([{ luogo: luogo, data_dal: dal, data_al: al, notti: notti, costo_giornaliero: costo }]);
            
            if (error) alert("Errore nel salvataggio viaggio: " + error.message);
            else {
                alert("Viaggio salvato!");
                document.getElementById('luogo').value = '';
                aggiornaSuggerimentiLuoghi();
            }
        }

        async function salvaRifornimento() {
            const luogo = document.getElementById('rifornimento_luogo').value || 'Generico / Fuori Viaggio';
            const dataRif = document.getElementById('data_rifornimento').value;
            const litri = document.getElementById('litri_rifornimento').value;
            const costo = document.getElementById('costo_rifornimento').value;

            if(!dataRif || !litri || !costo) return alert("Inserisci data, litri e costo del rifornimento");

            const { data, error } = await supabaseClient
                .from('rifornimenti')
                .insert([{ luogo: luogo, data_rifornimento: dataRif, litri: litri, costo_totale: costo }]);
            
            if (error) alert("Errore nel salvataggio rifornimento: " + error.message);
            else {
                alert("Rifornimento inserito!");
                document.getElementById('litri_rifornimento').value = '';
                document.getElementById('costo_rifornimento').value = '';
            }
        }

        // --- CALENDARIO MENSILE OPTIMIZZATO MOBILE ---
        let calendarInstance = null;

        async function inizializzaCalendario() {
            const { data: viaggi, error } = await supabaseClient.from('viaggi').select('*');
            if (error) {
                console.error("Errore recupero viaggi:", error);
                return;
            }

            let eventi = (viaggi || []).map(v => {
                let dataFine = new Date(v.data_al);
                dataFine.setDate(dataFine.getDate() + 1);
                let endIso = dataFine.toISOString().split('T')[0];

                return {
                    title: v.luogo,
                    start: v.data_dal,
                    end: endIso,
                    allDay: true
                };
            });

            const calendarEl = document.getElementById('calendar-container');
            const isMobile = window.innerWidth <= 768;

            if (!calendarInstance) {
                calendarInstance = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    locale: 'it',
                    firstDay: 1, // Imposta Lunedì come primo giorno della settimana
                    events: eventi,
                    height: 'auto',
                    handleWindowResize: true,
                    dayHeaderFormat: isMobile ? { weekday: 'narrow' } : { weekday: 'short' },
                    headerToolbar: isMobile ? {
                        left: 'prev,next',
                        center: 'title',
                        right: 'today'
                    } : {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth'
                    }
                });
                calendarInstance.render();
            } else {
                calendarInstance.setOption('firstDay', 1);
                calendarInstance.setOption('dayHeaderFormat', isMobile ? { weekday: 'narrow' } : { weekday: 'short' });
                calendarInstance.removeAllEvents();
                calendarInstance.addEventSource(eventi);
                calendarInstance.updateSize();
            }
        }
        
        window.addEventListener('resize', () => {
            if (calendarInstance) {
                const isMobile = window.innerWidth <= 768;
                calendarInstance.setOption('dayHeaderFormat', isMobile ? { weekday: 'narrow' } : { weekday: 'short' });
                calendarInstance.updateSize();
            }
        });

        // --- TABELLA COSTI AGGREGATI PER LUOGO ---
        async function caricaCosti() {
            const tbody = document.querySelector('#tabella-costi tbody');
            tbody.innerHTML = '<tr><td colspan="4">Caricamento in corso...</td></tr>';

            const { data: viaggi, errorViaggi } = await supabaseClient.from('viaggi').select('*');
            const { data: rifornimenti, errorRif } = await supabaseClient.from('rifornimenti').select('*');

            if (errorViaggi) console.error("Errore viaggi:", errorViaggi);
            if (errorRif) console.error("Errore rifornimenti:", errorRif);

            const mappaLuoghi = {};

            if (viaggi) {
                viaggi.forEach(v => {
                    const nomeLuogo = (v.luogo || 'Senza Nome').trim();
                    const notti = parseInt(v.notti) || 0;
                    const costoG = parseFloat(v.costo_giornaliero) || 0;
                    const costoTotCampeggio = notti * costoG;

                    if (!mappaLuoghi[nomeLuogo]) {
                        mappaLuoghi[nomeLuogo] = { campeggio: 0, notti: 0, carburante: 0, litri: 0 };
                    }
                    mappaLuoghi[nomeLuogo].campeggio += costoTotCampeggio;
                    mappaLuoghi[nomeLuogo].notti += notti;
                });
            }

            if (rifornimenti) {
                rifornimenti.forEach(r => {
                    const nomeLuogo = (r.luogo || 'Generico / Fuori Viaggio').trim();
                    const litri = parseFloat(r.litri) || 0;
                    const costoRif = parseFloat(r.costo_totale) || 0;

                    if (!mappaLuoghi[nomeLuogo]) {
                        mappaLuoghi[nomeLuogo] = { campeggio: 0, notti: 0, carburante: 0, litri: 0 };
                    }
                    mappaLuoghi[nomeLuogo].carburante += costoRif;
                    mappaLuoghi[nomeLuogo].litri += litri;
                });
            }

            let html = '';
            let totaleGenerale = 0;
            let totaleCampeggi = 0;
            let totaleCarburante = 0;

            const luoghiChiavi = Object.keys(mappaLuoghi);

            if (luoghiChiavi.length === 0) {
                html = '<tr><td colspan="4">Nessun costo registrato finora.</td></tr>';
            } else {
                luoghiChiavi.forEach(luogo => {
                    const dati = mappaLuoghi[luogo];
                    const totaleLuogo = dati.campeggio + dati.carburante;
                    
                    totaleCampeggi += dati.campeggio;
                    totaleCarburante += dati.carburante;
                    totaleGenerale += totaleLuogo;

                    html += `<tr>
                        <td><strong>${luogo}</strong></td>
                        <td>${dati.campeggio.toFixed(2)} € <small style="color:#666;">(${dati.notti} notti)</small></td>
                        <td>${dati.carburante.toFixed(2)} € <small style="color:#666;">(${dati.litri.toFixed(1)} L)</small></td>
                        <td><strong>${totaleLuogo.toFixed(2)} €</strong></td>
                    </tr>`;
                });

                html += `<tr class="total-row">
                    <td>TOTALE COMPLESSIVO</td>
                    <td>${totaleCampeggi.toFixed(2)} €</td>
                    <td>${totaleCarburante.toFixed(2)} €</td>
                    <td style="color: var(--secondary);">${totaleGenerale.toFixed(2)} €</td>
                </tr>`;
            }

            tbody.innerHTML = html;
        }
    </script>
</body>
</html>

 <!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Camper & Viaggi</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: #334155;
      --star-color: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 20px; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

    .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    h2, h3, h4 { color: var(--text-main); margin-bottom: 12px; }

    /* Header e Auth */
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
    .btn { background: var(--accent); color: #000; font-weight: 600; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary { background: #475569; color: #fff; }
    .btn-secondary:hover { background: #64748b; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 4px 10px; font-size: 0.85rem; }

    /* Forms & Inputs */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    input, select { background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }
    input:focus { border-color: var(--accent); }

    /* Range Sliders Camper */
    .range-container { display: flex; align-items: center; gap: 12px; }
    .range-container input[type="range"] { flex: 1; accent-color: var(--accent); }

    /* Valutazioni a Stelline */
    .star-rating { display: inline-flex; flex-direction: row-reverse; font-size: 1.5rem; justify-content: flex-end; }
    .star-rating input { display: none; }
    .star-rating label { color: #475569; cursor: pointer; padding: 0 3px; transition: color 0.2s; }
    .star-rating input:checked ~ label,
    .star-rating label:hover,
    .star-rating label:hover ~ label { color: var(--star-color); }
    .stars-display { color: var(--star-color); letter-spacing: 2px; }

    /* Calendario */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .calendar-day-header { text-align: center; font-weight: bold; color: var(--text-muted); padding: 6px; font-size: 0.85rem; }
    .calendar-day { background: #0f172a; border: 1px solid var(--border-color); min-height: 65px; border-radius: 8px; padding: 6px; position: relative; cursor: pointer; transition: transform 0.1s; }
    .calendar-day:hover { transform: translateY(-2px); }
    .calendar-day.has-trip { border-width: 2px; font-weight: bold; }
    .day-num { font-size: 0.8rem; opacity: 0.8; }
    .trip-badge { display: block; font-size: 0.8rem; text-align: center; margin-top: 6px; padding: 2px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(255,255,255,0.15); }

    /* Tooltip / Popup Calendario */
    .calendar-tooltip {
      position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%);
      background: #020617; border: 1px solid var(--border-color); padding: 14px;
      border-radius: 10px; width: 270px; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      font-size: 0.85rem; font-weight: normal; color: var(--text-main);
    }
    .calendar-tooltip h4 { margin-bottom: 8px; color: var(--accent); font-size: 1rem; }
    .calendar-tooltip p { margin: 4px 0; }

    /* Tabella Storico */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; text-align: left; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); }
    th { color: var(--text-muted); font-weight: 600; background: #0f172a; }
  </style>
</head>
<body>

<div class="container">

  <!-- HEADER & USER AUTH -->
  <div class="header">
    <h1>🚐 Gestione Camper & Viaggi</h1>
    <div id="auth-status">
      <span id="user-email">Caricamento utente...</span>
      <button onclick="handleLogout()" class="btn btn-secondary btn-sm" style="margin-left: 10px;">Logout</button>
    </div>
  </div>

  <!-- PANNELLO STATO CAMPER -->
  <div class="card">
    <h3>🛠️ Stato Attuale Camper</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>⛽ Serbatoio Carburante: <strong id="lbl-carburante">50</strong>%</label>
        <div class="range-container">
          <input type="range" id="livello_carburante" min="0" max="100" step="5" value="50" oninput="document.getElementById('lbl-carburante').innerText = this.value">
        </div>
      </div>
      <div class="form-group">
        <label>💧 Serbatoio Acque Chiare: <strong id="lbl-acqua">50</strong>%</label>
        <div class="range-container">
          <input type="range" id="livello_acqua" min="0" max="100" step="5" value="50" oninput="document.getElementById('lbl-acqua').innerText = this.value">
        </div>
      </div>
    </div>
    <button onclick="salvaSettingsCamper()" class="btn btn-sm">Aggiorna Livelli Camper</button>
  </div>

  <!-- REGISTRAZIONE NUOVO VIAGGIO -->
  <div class="card">
    <h3>➕ Inserisci Nuovo Viaggio</h3>
    <form id="form-viaggio" onsubmit="event.preventDefault(); salvaViaggio();">
      <div class="form-grid">
        <div class="form-group">
          <label>Destinazione</label>
          <input type="text" id="destinazione" required placeholder="Es. Costa Azzurra">
        </div>
        <div class="form-group">
          <label>Data Partenza</label>
          <input type="date" id="data_partenza" required>
        </div>
        <div class="form-group">
          <label>Data Arrivo</label>
          <input type="date" id="data_arrivo" required>
        </div>
        <div class="form-group">
          <label>Chilometri Percorsi</label>
          <input type="number" id="chilometri" value="0" min="0">
        </div>
        <div class="form-group">
          <label>Costo Camping / Sosta (€/notte)</label>
          <input type="number" step="0.01" id="costo_campeggio_notte" value="0" min="0">
        </div>
        <div class="form-group">
          <label>Costo Pedaggi / Autostrada (€)</label>
          <input type="number" step="0.01" id="costo_pedaggi" value="0" min="0">
        </div>
      </div>

      <div class="form-grid">
        <!-- Valutazione Luogo -->
        <div class="form-group">
          <label>Valutazione Luogo Visitato:</label>
          <div class="star-rating">
            <input type="radio" id="l5" name="voto_luogo" value="5"><label for="l5">★</label>
            <input type="radio" id="l4" name="voto_luogo" value="4"><label for="l4">★</label>
            <input type="radio" id="l3" name="voto_luogo" value="3"><label for="l3">★</label>
            <input type="radio" id="l2" name="voto_luogo" value="2"><label for="l2">★</label>
            <input type="radio" id="l1" name="voto_luogo" value="1"><label for="l1">★</label>
          </div>
        </div>

        <!-- Valutazione Campeggio -->
        <div class="form-group">
          <label>Valutazione Campeggio / Sosta:</label>
          <div class="star-rating">
            <input type="radio" id="c5" name="voto_campeggio" value="5"><label for="c5">★</label>
            <input type="radio" id="c4" name="voto_campeggio" value="4"><label for="c4">★</label>
            <input type="radio" id="c3" name="voto_campeggio" value="3"><label for="c3">★</label>
            <input type="radio" id="c2" name="voto_campeggio" value="2"><label for="c2">★</label>
            <input type="radio" id="c1" name="voto_campeggio" value="1"><label for="c1">★</label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn">Salva Viaggio</button>
    </form>
  </div>

  <!-- CALENDARIO INTERATTIVO -->
  <div class="card">
    <div class="calendar-header">
      <button onclick="changeMonth(-1)" class="btn btn-secondary btn-sm">◀ Mese Prec.</button>
      <h3 id="calendar-month-year"></h3>
      <button onclick="changeMonth(1)" class="btn btn-secondary btn-sm">Mese Succ. ▶</button>
    </div>
    <div class="calendar-grid">
      <div class="calendar-day-header">Lun</div>
      <div class="calendar-day-header">Mar</div>
      <div class="calendar-day-header">Mer</div>
      <div class="calendar-day-header">Gio</div>
      <div class="calendar-day-header">Ven</div>
      <div class="calendar-day-header">Sab</div>
      <div class="calendar-day-header">Dom</div>
    </div>
    <div id="calendar-days-container" class="calendar-grid"></div>
  </div>

  <!-- TABELLA STORICO VIAGGI -->
  <div class="card">
    <h3>📜 Storico Viaggi</h3>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Destinazione</th>
            <th>Periodo</th>
            <th>Km</th>
            <th>Voto Luogo</th>
            <th>Voto Camping</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody id="viaggi-table-body"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  // ==========================================
  // CONFIGURAZIONE SUPABASE
  // ==========================================
    const SUPABASE_URL = 'https://erukzvrtjnvyzjvfuirn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FDhQ03affjzeyhCHuoKulg_Rp7PdyLM';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let viaggiList = [];
  let currentCalendarDate = new Date();

  const TRIP_COLORS = [
    { bg: '#1e3a8a', border: '#3b82f6', text: '#93c5fd' },
    { bg: '#064e3b', border: '#10b981', text: '#a7f3d0' },
    { bg: '#701a75', border: '#d946ef', text: '#f5d0fe' },
    { bg: '#7c2d12', border: '#f97316', text: '#ffedd5' }
  ];

  // INIZIALIZZAZIONE
  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      alert("Utente non autenticato. Effettua prima il login.");
      return;
    }
    currentUser = session.user;
    document.getElementById('user-email').innerText = currentUser.email;

    await Promise.all([
      fetchViaggi(),
      loadCamperSettings()
    ]);
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
    window.location.reload();
  }

  // RECUPERO VIAGGI
  async function fetchViaggi() {
    const { data, error } = await supabaseClient
      .from('viaggi')
      .select('*, rifornimenti(*)')
      .eq('user_id', currentUser.id)
      .order('data_partenza', { ascending: false });

    if (error) {
      console.error('Errore recupero viaggi:', error.message);
      return;
    }

    viaggiList = data || [];
    renderCalendar();
    renderViaggiTable();
  }

  // SALVATAGGIO VIAGGIO
  async function salvaViaggio() {
    const votoLuogo = getRatingValue('voto_luogo');
    const votoCampeggio = getRatingValue('voto_campeggio');

    const payload = {
      user_id: currentUser.id,
      destinazione: document.getElementById('destinazione').value,
      data_partenza: document.getElementById('data_partenza').value,
      data_arrivo: document.getElementById('data_arrivo').value,
      chilometri: Number(document.getElementById('chilometri').value || 0),
      costo_campeggio_notte: Number(document.getElementById('costo_campeggio_notte').value || 0),
      costo_pedaggi: Number(document.getElementById('costo_pedaggi').value || 0),
      voto_luogo: votoLuogo,
      voto_campeggio: votoCampeggio
    };

    const { error } = await supabaseClient.from('viaggi').insert([payload]);

    if (error) {
      alert('Errore nel salvataggio del viaggio: ' + error.message);
    } else {
      document.getElementById('form-viaggio').reset();
      fetchViaggi();
    }
  }

  async function eliminaViaggio(id) {
    if (!confirm('Sei sicuro di voler eliminare questo viaggio?')) return;
    const { error } = await supabaseClient.from('viaggi').delete().eq('id', id);
    if (!error) fetchViaggi();
  }

  // IMPOSTAZIONI CAMPER
  async function loadCamperSettings() {
    const { data } = await supabaseClient
      .from('camper_settings')
      .select('*')
      .eq('user_id', currentUser.id)
      .maybeSingle();

    if (data) {
      const carb = data.livello_carburante ?? 50;
      const acq = data.livello_acqua ?? 50;
      document.getElementById('livello_carburante').value = carb;
      document.getElementById('lbl-carburante').innerText = carb;
      document.getElementById('livello_acqua').value = acq;
      document.getElementById('lbl-acqua').innerText = acq;
    }
  }

  async function salvaSettingsCamper() {
    const carb = parseInt(document.getElementById('livello_carburante').value);
    const acq = parseInt(document.getElementById('livello_acqua').value);

    const { error } = await supabaseClient
      .from('camper_settings')
      .upsert({ user_id: currentUser.id, livello_carburante: carb, livello_acqua: acq });

    if (error) alert("Errore nel salvataggio impostazioni: " + error.message);
    else alert("Stato livelli camper aggiornato!");
  }

  // RENDER CALENDARIO
  function renderCalendar() {
    const year = currentCalendarDate.getFullYear();
    const month = currentCalendarDate.getMonth();
    const monthNames = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
    
    document.getElementById('calendar-month-year').textContent = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startingDay = (firstDay.getDay() + 6) % 7;

    const daysContainer = document.getElementById('calendar-days-container');
    daysContainer.innerHTML = '';

    for (let i = 0; i < startingDay; i++) {
      daysContainer.appendChild(document.createElement('div'));
    }

    for (let day = 1; day <= lastDay.getDate(); day++) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'calendar-day';

      const currentFormatted = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const tripInDay = viaggiList.find(v => v.data_partenza <= currentFormatted && v.data_arrivo >= currentFormatted);

      if (tripInDay) {
        dayDiv.classList.add('has-trip');
        const tripIndex = viaggiList.findIndex(v => v.id === tripInDay.id);
        const color = TRIP_COLORS[tripIndex % TRIP_COLORS.length];

        dayDiv.style.backgroundColor = color.bg;
        dayDiv.style.borderColor = color.border;
        dayDiv.style.color = color.text;

        dayDiv.innerHTML = `<span class="day-num">${day}</span><span class="trip-badge">${escapeHtml(tripInDay.destinazione)}</span>`;

        dayDiv.addEventListener('click', (e) => {
          e.stopPropagation();

          const existingTooltip = dayDiv.querySelector('.calendar-tooltip');
          if (existingTooltip) {
            existingTooltip.remove();
            return;
          }

          document.querySelectorAll('.calendar-tooltip').forEach(el => el.remove());

          const notti = calculateNights(tripInDay.data_partenza, tripInDay.data_arrivo);
          const camping = notti * Number(tripInDay.costo_campeggio_notte || 0);
          const pedaggi = Number(tripInDay.costo_pedaggi || 0);
          const rifList = tripInDay.rifornimenti || [];
          const carburante = rifList.reduce((s, r) => s + Number(r.costo_sostenuto || 0), 0);
          const totale = camping + pedaggi + carburante;

          const tooltip = document.createElement('div');
          tooltip.className = 'calendar-tooltip';
          tooltip.addEventListener('click', (evt) => evt.stopPropagation());

          tooltip.innerHTML = `
            <h4>📍 ${escapeHtml(tripInDay.destinazione)}</h4>
            <p>📅 <strong>Periodo:</strong> ${formatDate(tripInDay.data_partenza)} - ${formatDate(tripInDay.data_arrivo)} (${notti} gg)</p>
            <p>🏙️ <strong>Voto Luogo:</strong> ${getStarsHTML(tripInDay.voto_luogo)}</p>
            <p>🏕️ <strong>Voto Camping:</strong> ${getStarsHTML(tripInDay.voto_campeggio)}</p>
            <p>💶 <strong>Spesa Totale:</strong> € ${totale.toFixed(2)}</p>
            <button onclick="this.closest('.calendar-tooltip').remove();" class="btn-secondary btn-sm" style="width:100%; margin-top:10px;">Chiudi Dettagli</button>
          `;

          dayDiv.appendChild(tooltip);
        });
      } else {
        dayDiv.innerHTML = `<span class="day-num">${day}</span>`;
      }

      daysContainer.appendChild(dayDiv);
    }
  }

  function changeMonth(delta) {
    currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
    renderCalendar();
  }

  // RENDER TABELLA STORICO
  function renderViaggiTable() {
    const tbody = document.getElementById('viaggi-table-body');
    tbody.innerHTML = '';

    viaggiList.forEach(v => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${escapeHtml(v.destinazione)}</strong></td>
        <td>${formatDate(v.data_partenza)} - ${formatDate(v.data_arrivo)}</td>
        <td>${v.chilometri} km</td>
        <td>${getStarsHTML(v.voto_luogo)}</td>
        <td>${getStarsHTML(v.voto_campeggio)}</td>
        <td><button onclick="eliminaViaggio(${v.id})" class="btn-danger btn-sm">❌ Elimina</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // UTILITY HELPERS
  function getRatingValue(name) {
    const selected = document.querySelector(`input[name="${name}"]:checked`);
    return selected ? parseInt(selected.value) : null;
  }

  function getStarsHTML(rating) {
    if (!rating) return '<span style="opacity:0.5;">-</span>';
    const r = parseInt(rating);
    return `<span class="stars-display">${'★'.repeat(r)}${'☆'.repeat(5 - r)}</span>`;
  }

  function calculateNights(start, end) {
    const d1 = new Date(start);
    const d2 = new Date(end);
    const diff = Math.abs(d2 - d1);
    return Math.max(1, Math.ceil(diff / (1000 * 60 * 60 * 24)));
  }

  function formatDate(str) {
    if (!str) return '';
    const [y, m, d] = str.split('-');
    return `${d}/${m}/${y}`;
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Chiusura tooltip quando si clicca fuori dal calendario
  document.addEventListener('click', () => {
    document.querySelectorAll('.calendar-tooltip').forEach(el => el.remove());
  });

  // Avvio script al caricamento
  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>

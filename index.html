
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Viaggi Multi-Utente</title>
  
  <!-- SDK Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 950px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #0070f3; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-secondary { background: #e2e8f0; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; }
    .flex { display: flex; gap: 10px; }
    .flex-center { display: flex; justify-content: space-between; align-items: center; }
    .error { color: #dc3545; font-size: 14px; margin-bottom: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- ==================== SCHERMATA LOGIN / REGISTRAZIONE ==================== -->
  <div id="auth-section" class="card" style="max-width: 400px; margin: 50px auto;">
    <h2 id="auth-title">Accedi</h2>
    <div id="auth-error" class="error hidden"></div>
    
    <form id="auth-form">
      <div class="form-group">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" required placeholder="inserisci@email.com">
      </div>
      <div class="form-group">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" required minlength="6" placeholder="Almeno 6 caratteri">
      </div>
      <button type="submit" id="auth-submit-btn" class="btn-primary" style="width: 100%;">Accedi</button>
    </form>

    <p style="text-align: center; font-size: 14px; margin-top: 15px;">
      <span id="auth-toggle-text">Non hai un account?</span>
      <a href="#" id="auth-toggle-btn" style="color: #0070f3;">Registrati</a>
    </p>
  </div>

  <!-- ==================== DASHBOARD GESTIONE VIAGGIO ==================== -->
  <div id="app-section" class="hidden">
    <div class="flex-center" style="margin-bottom: 20px;">
      <div>
        <h1 style="margin: 0;">I Miei Viaggi</h1>
        <small id="user-email-display" style="color: #666;"></small>
      </div>
      <button id="logout-btn" class="btn-secondary">Logout</button>
    </div>

    <!-- FORM INSERIMENTO / MODIFICA -->
    <div class="card">
      <h3 id="form-title" style="margin-top:0;">Aggiungi Nuovo Viaggio</h3>
      <form id="viaggio-form">
        <input type="hidden" id="viaggio-id">
        
        <div class="flex" style="flex-wrap: wrap;">
          <div style="flex: 2; min-width: 180px;">
            <label for="destinazione">Destinazione</label>
            <input type="text" id="destinazione" required placeholder="Es. Roma">
          </div>
          <div style="flex: 1; min-width: 130px;">
            <label for="data_partenza">Data Partenza</label>
            <input type="date" id="data_partenza" required>
          </div>
          <div style="flex: 1; min-width: 130px;">
            <label for="data_arrivo">Data Arrivo</label>
            <input type="date" id="data_arrivo" required>
          </div>
          <div style="flex: 1; min-width: 100px;">
            <label for="chilometri">Chilometri</label>
            <input type="number" step="0.1" id="chilometri" required placeholder="0">
          </div>
          <div style="flex: 1; min-width: 100px;">
            <label for="costo_pedaggi">Pedaggio (€)</label>
            <input type="number" step="0.01" id="costo_pedaggi" value="0">
          </div>
        </div>

        <div style="margin-top: 15px; display: flex; gap: 10px;">
          <button type="submit" id="save-btn" class="btn-primary">Aggiungi Viaggio</button>
          <button type="button" id="cancel-edit-btn" class="btn-secondary hidden">Annulla</button>
        </div>
      </form>
    </div>

    <!-- TABELLA DATI -->
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Destinazione</th>
            <th>Partenza</th>
            <th>Arrivo</th>
            <th>Chilometri</th>
            <th>Costo Pedaggi</th>
            <th style="text-align: right;">Azioni</th>
          </tr>
        </thead>
        <tbody id="viaggi-table-body">
          <!-- Righe inserite dinamicamente via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- ==================== LOGICA JAVASCRIPT ==================== -->
  <script>

    // 1. INIZIALIZZAZIONE SICURA DI SUPABASE
    const { createClient } = window.supabase;

    // Sostituisci con i tuoi dati reali di Supabase (Project Settings > API)
    const SUPABASE_URL = 'https://erukzvrtjnvyzjvfuirn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FDhQ03affjzeyhCHuoKulg_Rp7PdyLM';
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. RIFERIMENTI DOM
    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const authForm = document.getElementById('auth-form');
    const authTitle = document.getElementById('auth-title');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const authToggleText = document.getElementById('auth-toggle-text');
    const authToggleBtn = document.getElementById('auth-toggle-btn');
    const authError = document.getElementById('auth-error');
    const userEmailDisplay = document.getElementById('user-email-display');
    const logoutBtn = document.getElementById('logout-btn');

    const viaggioForm = document.getElementById('viaggio-form');
    const viaggioIdInput = document.getElementById('viaggio-id');
    const destinazioneInput = document.getElementById('destinazione');
    const dataPartenzaInput = document.getElementById('data_partenza');
    const dataArrivoInput = document.getElementById('data_arrivo');
    const chilometriInput = document.getElementById('chilometri');
    const costoPedaggiInput = document.getElementById('costo_pedaggi');
    const formTitle = document.getElementById('form-title');
    const saveBtn = document.getElementById('save-btn');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');
    const viaggiTableBody = document.getElementById('viaggi-table-body');

    let isRegisterMode = false;
    let currentUser = null;

    // 3. GESTIONE AUTENTICAZIONE
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        currentUser = session.user;
        userEmailDisplay.textContent = `Utente: ${currentUser.email}`;
        authSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        fetchViaggi();
      } else {
        currentUser = null;
        appSection.classList.add('hidden');
        authSection.classList.remove('hidden');
      }
    });

    // Toggle tra Login e Registrazione
    authToggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      isRegisterMode = !isRegisterMode;
      authError.classList.add('hidden');
      if (isRegisterMode) {
        authTitle.textContent = 'Registrazione';
        authSubmitBtn.textContent = 'Registrati';
        authToggleText.textContent = 'Hai già un account?';
        authToggleBtn.textContent = 'Accedi';
      } else {
        authTitle.textContent = 'Accedi';
        authSubmitBtn.textContent = 'Accedi';
        authToggleText.textContent = 'Non hai un account?';
        authToggleBtn.textContent = 'Registrati';
      }
    });

    // Submit Auth Form
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      let response;
      if (isRegisterMode) {
        response = await supabaseClient.auth.signUp({ email, password });
      } else {
        response = await supabaseClient.auth.signInWithPassword({ email, password });
      }

      if (response.error) {
        authError.textContent = response.error.message;
        authError.classList.remove('hidden');
      } else if (isRegisterMode) {
        alert('Registrazione completata! Puoi effettuare il login.');
        authToggleBtn.click();
      }
    });

    // Logout
    logoutBtn.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
    });

    // 4. LETTURA DATI (READ)
    async function fetchViaggi() {
      const { data, error } = await supabaseClient
        .from('viaggi')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Errore durante il recupero dei dati:', error.message);
        return;
      }

      renderViaggi(data || []);
    }

    // Renderizza dati nella tabella
    function renderViaggi(viaggi) {
      viaggiTableBody.innerHTML = '';

      if (viaggi.length === 0) {
        viaggiTableBody.innerHTML = `
          <tr>
            <td colSpan="6" style="text-align: center; color: #888;">Nessun viaggio trovato.</td>
          </tr>
        `;
        return;
      }

      viaggi.forEach(item => {
        const tr = document.createElement('tr');
        const pedaggio = Number(item.costo_pedaggi || 0).toFixed(2);
        
        // Formattazione Date leggibili (gg/mm/aaaa)
        const dPartenza = item.data_partenza ? formatDate(item.data_partenza) : '-';
        const dArrivo = item.data_arrivo ? formatDate(item.data_arrivo) : '-';

        tr.innerHTML = `
          <td>${escapeHtml(item.destinazione)}</td>
          <td>${dPartenza}</td>
          <td>${dArrivo}</td>
          <td>${item.chilometri} km</td>
          <td>€ ${pedaggio}</td>
          <td style="text-align: right;">
            <button class="btn-secondary" onclick="prepareEdit(${item.id}, '${escapeJs(item.destinazione)}', '${item.data_partenza || ''}', '${item.data_arrivo || ''}', ${item.chilometri}, ${item.costo_pedaggi || 0})">Modifica</button>
            <button class="btn-danger" onclick="deleteViaggio(${item.id})">Elimina</button>
          </td>
        `;
        viaggiTableBody.appendChild(tr);
      });
    }

    // 5. SALVATAGGIO / MODIFICA (CREATE / UPDATE)
    viaggioForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = viaggioIdInput.value;
      const payload = {
        destinazione: destinazioneInput.value,
        data_partenza: dataPartenzaInput.value,
        data_arrivo: dataArrivoInput.value,
        chilometri: parseFloat(chilometriInput.value) || 0,
        costo_pedaggi: parseFloat(costoPedaggiInput.value) || 0,
        user_id: currentUser.id
      };

      let error;
      if (id) {
        // Modifica
        const res = await supabaseClient.from('viaggi').update(payload).eq('id', id);
        error = res.error;
      } else {
        // Inserimento
        const res = await supabaseClient.from('viaggi').insert([payload]);
        error = res.error;
      }

      if (error) {
        alert('Errore durante il salvataggio: ' + error.message);
      } else {
        resetViaggioForm();
        fetchViaggi();
      }
    });

    // Preparazione Form per Modifica
    window.prepareEdit = function(id, destinazione, dataPartenza, dataArrivo, chilometri, costoPedaggi) {
      viaggioIdInput.value = id;
      destinazioneInput.value = destinazione;
      dataPartenzaInput.value = dataPartenza;
      dataArrivoInput.value = dataArrivo;
      chilometriInput.value = chilometri;
      costoPedaggiInput.value = costoPedaggi;

      formTitle.textContent = 'Modifica Viaggio';
      saveBtn.textContent = 'Aggiorna Viaggio';
      saveBtn.className = 'btn-success';
      cancelEditBtn.classList.remove('hidden');
    };

    cancelEditBtn.addEventListener('click', resetViaggioForm);

    function resetViaggioForm() {
      viaggioIdInput.value = '';
      viaggioForm.reset();
      costoPedaggiInput.value = 0;
      formTitle.textContent = 'Aggiungi Nuovo Viaggio';
      saveBtn.textContent = 'Aggiungi Viaggio';
      saveBtn.className = 'btn-primary';
      cancelEditBtn.classList.add('hidden');
    }

    // 6. CANCELLAZIONE (DELETE)
    window.deleteViaggio = async function(id) {
      if (!confirm('Sei sicuro di voler eliminare questo viaggio?')) return;

      const { error } = await supabaseClient.from('viaggi').delete().eq('id', id);
      if (error) {
        alert('Errore durante l\'eliminazione: ' + error.message);
      } else {
        fetchViaggi();
      }
    };

    // Helper Utility Functions
    function formatDate(dateString) {
      const parts = dateString.split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return dateString;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    
    function escapeJs(str) {
      return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
  </script>
</body>
</html>
